<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Messages · Lumière Spa</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --c-bg:#faf7f2;--c-bg-alt:#f4ede4;--c-surface:#fff;
    --c-ink:#2b1d13;--c-ink-soft:#5c4a3a;--c-ink-muted:#8a7a6a;
    --c-brand:#b9926a;--c-brand-dark:#8f6d4a;--c-brand-soft:#f1e6d8;
    --c-border:#e8ddce;--c-border-strong:#d9c9b3;
    --c-error:#c0392b;--c-error-bg:#fdecea;
    --c-success:#1e7a3c;--c-success-bg:#e8f5ec;
    --c-warn:#b8860b;--c-warn-bg:#fdf6e3;
    --c-info:#2a5d95;--c-info-bg:#eef4fb;
    --radius-sm:8px;--radius:12px;--radius-lg:20px;--radius-pill:999px;
    --shadow-sm:0 2px 6px rgba(43,29,19,.06);
    --shadow:0 10px 30px rgba(43,29,19,.08);
    --font-body:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --font-display:'Cormorant Garamond',Georgia,serif;
    --transition:200ms cubic-bezier(.4,0,.2,1);
    --sidebar-w:260px;--list-w:360px;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{font-family:var(--font-body);color:var(--c-ink);background:var(--c-bg);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
  img{display:block;max-width:100%}a{color:inherit;text-decoration:none}button,input,textarea,select{font-family:inherit}
  h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0 0 .3em;line-height:1.15;letter-spacing:-.01em}

  .app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;height:100vh;overflow:hidden}

  /* ───── SIDEBAR ───── */
  .sidebar{position:relative;height:100vh;display:flex;flex-direction:column;padding:26px 18px 18px;background:radial-gradient(90% 40% at 0% 100%,rgba(185,146,106,.22),transparent 60%),linear-gradient(165deg,#2b1d13 0%,#3a281b 60%,#4a3423 100%);color:#f6ede4;overflow-y:auto;z-index:20}
  .brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px;font-family:var(--font-display);font-size:21px;font-weight:700;letter-spacing:.02em;border-bottom:1px solid rgba(246,237,228,.1);margin-bottom:18px}
  .brand-mark{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#d8b48f,#b9926a);color:#2b1d13;font-family:var(--font-display);font-size:18px;font-weight:700;flex:none}
  .brand-name{color:#f6ede4}
  .nav{display:flex;flex-direction:column;gap:2px;flex:1}
  .nav-label{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(246,237,228,.4);padding:16px 12px 8px}
  .nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius);font-size:14px;font-weight:500;color:rgba(246,237,228,.75);cursor:pointer;position:relative;transition:background var(--transition),color var(--transition)}
  .nav-item:hover{background:rgba(246,237,228,.07);color:#f8f1e8}
  .nav-item.active{background:linear-gradient(135deg,rgba(185,146,106,.28),rgba(185,146,106,.14));color:#fff;box-shadow:inset 0 0 0 1px rgba(185,146,106,.35)}
  .nav-item.active::before{content:"";position:absolute;left:-18px;top:50%;transform:translateY(-50%);width:3px;height:22px;border-radius:0 3px 3px 0;background:var(--c-brand)}
  .nav-item .ico{width:20px;height:20px;flex:none;stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .nav-item .badge{margin-left:auto;font-size:11px;font-weight:700;padding:2px 8px;border-radius:var(--radius-pill);background:rgba(185,146,106,.35);color:#f8f1e8}
  .user-card{display:flex;align-items:center;gap:12px;padding:12px;margin-top:14px;border-radius:var(--radius);background:rgba(246,237,228,.06);border:1px solid rgba(246,237,228,.08);cursor:pointer;transition:background var(--transition)}
  .user-card:hover{background:rgba(246,237,228,.11)}
  .user-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#4a3423;border:2px solid rgba(246,237,228,.15);flex:none}
  .user-meta{min-width:0;flex:1}
  .user-name{font-size:13.5px;font-weight:600;color:#f8f1e8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .user-role{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--c-brand)}
  .user-signout{background:transparent;border:0;color:rgba(246,237,228,.5);cursor:pointer;padding:4px;border-radius:6px;display:grid;place-items:center;transition:background var(--transition),color var(--transition)}
  .user-signout:hover{background:rgba(192,57,43,.25);color:#ffd9d4}

  /* ───── MAIN ───── */
  .main{min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden}
  .topbar{display:flex;align-items:center;gap:16px;padding:16px 28px;background:var(--c-bg);border-bottom:1px solid var(--c-border);flex-shrink:0}
  .menu-toggle{display:none;background:transparent;border:1px solid var(--c-border);border-radius:var(--radius-sm);padding:8px;cursor:pointer;color:var(--c-ink)}
  .page-title{font-family:var(--font-display);font-size:22px;font-weight:600;margin:0}
  .page-sub{font-size:12.5px;color:var(--c-ink-muted);margin:0}
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .icon-btn{display:grid;place-items:center;width:38px;height:38px;border-radius:var(--radius);background:var(--c-surface);border:1px solid var(--c-border);color:var(--c-ink-soft);cursor:pointer;transition:background var(--transition),border-color var(--transition),color var(--transition)}
  .icon-btn:hover{background:var(--c-brand-soft);border-color:var(--c-border-strong);color:var(--c-brand-dark)}
  .icon-btn svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:round;stroke-linejoin:round}

  /* ───── INBOX ───── */
  .inbox{flex:1;display:grid;grid-template-columns:var(--list-w) 1fr;min-height:0;overflow:hidden}

  /* --- list --- */
  .list-col{display:flex;flex-direction:column;border-right:1px solid var(--c-border);background:var(--c-surface);min-height:0;overflow:hidden}
  .list-tools{padding:14px 16px 10px;border-bottom:1px solid var(--c-border);flex-shrink:0}
  .search-wrap{position:relative;margin-bottom:10px}
  .search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--c-ink-muted);stroke-width:1.75;fill:none;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
  .search-wrap input{width:100%;padding:9px 14px 9px 34px;font-size:13.5px;border:1px solid var(--c-border);border-radius:var(--radius-pill);background:var(--c-bg);outline:none;transition:border-color var(--transition),box-shadow var(--transition)}
  .search-wrap input:focus{border-color:var(--c-brand);box-shadow:0 0 0 4px rgba(185,146,106,.15);background:#fff}

  .status-chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{padding:5px 12px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:var(--radius-pill);background:var(--c-bg);color:var(--c-ink-soft);border:1px solid var(--c-border);cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:background var(--transition),color var(--transition),border-color var(--transition)}
  .chip:hover{border-color:var(--c-border-strong)}
  .chip.active{background:linear-gradient(135deg,var(--c-brand),var(--c-brand-dark));color:#fff;border-color:transparent}
  .chip .n{font-weight:800;opacity:.75}

  .list-scroll{flex:1;overflow-y:auto;min-height:0}

  .ticket{display:block;padding:14px 18px;border-bottom:1px solid var(--c-border);cursor:pointer;position:relative;transition:background var(--transition)}
  .ticket:hover{background:var(--c-bg)}
  .ticket.selected{background:var(--c-brand-soft);border-right:3px solid var(--c-brand)}
  .ticket.unread .ticket-name::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c-accent,#c0392b);margin-left:8px;vertical-align:middle}
  .ticket-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
  .ticket-name{font-size:13.5px;font-weight:700;color:var(--c-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
  .ticket-time{font-size:11px;color:var(--c-ink-muted);white-space:nowrap;flex-shrink:0}
  .ticket-subj{font-size:13px;font-weight:600;color:var(--c-ink-soft);margin:0 0 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ticket-snippet{font-size:12.5px;color:var(--c-ink-muted);margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ticket-foot{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
  .pill{padding:3px 9px;border-radius:var(--radius-pill);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;display:inline-flex;align-items:center;gap:5px}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .pill.open{background:var(--c-info-bg);color:var(--c-info)}
  .pill.pending{background:var(--c-warn-bg);color:var(--c-warn)}
  .pill.resolved{background:var(--c-success-bg);color:var(--c-success)}
  .pill.closed{background:#f1e6d8;color:#8a7a6a}
  .pill.code{background:var(--c-bg-alt);color:var(--c-ink-muted);font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600;letter-spacing:.02em;font-size:10.5px}
  .pill.code::before{display:none}

  /* --- thread --- */
  .thread-col{display:flex;flex-direction:column;background:var(--c-bg);min-height:0;overflow:hidden;position:relative}

  .thread-head{padding:16px 26px;background:var(--c-surface);border-bottom:1px solid var(--c-border);display:flex;align-items:center;gap:16px;flex-shrink:0}
  .thread-head .who{min-width:0;flex:1}
  .thread-head h2{font-size:20px;margin:0 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .thread-head .sub{font-size:12.5px;color:var(--c-ink-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .thread-head .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  .status-select{padding:7px 32px 7px 12px;font-size:12.5px;font-weight:600;border:1px solid var(--c-border);border-radius:var(--radius);background:var(--c-surface);color:var(--c-ink-soft);cursor:pointer;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238a7a6a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 8px center;background-size:14px;outline:none;transition:border-color var(--transition)}
  .status-select:focus{border-color:var(--c-brand)}

  .btn-sm{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;font-size:12.5px;font-weight:600;border-radius:var(--radius);cursor:pointer;border:1px solid var(--c-border-strong);background:var(--c-surface);color:var(--c-ink-soft);transition:background var(--transition),border-color var(--transition),color var(--transition),transform var(--transition)}
  .btn-sm:hover{transform:translateY(-1px)}
  .btn-sm svg{width:13px;height:13px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .btn-sm.danger{color:var(--c-error);border-color:#f3c3bd;background:var(--c-error-bg)}
  .btn-sm.danger:hover{background:var(--c-error);color:#fff;border-color:var(--c-error)}

  .thread-scroll{flex:1;overflow-y:auto;padding:26px;min-height:0}
  .thread-scroll::-webkit-scrollbar{width:8px}
  .thread-scroll::-webkit-scrollbar-thumb{background:var(--c-border-strong);border-radius:4px}

  .msg{max-width:720px;margin:0 auto 18px;display:flex;gap:12px}
  .msg .avatar{width:36px;height:36px;border-radius:50%;background:var(--c-brand-soft);color:var(--c-brand-dark);display:grid;place-items:center;font-weight:700;font-family:var(--font-display);font-size:15px;flex-shrink:0}
  .msg.client .avatar{background:linear-gradient(135deg,var(--c-brand),var(--c-brand-dark));color:#fff}
  .msg.staff .avatar{background:#2b1d13;color:#f2d8a8}

  .msg .bubble{background:var(--c-surface);border:1px solid var(--c-border);border-radius:14px;padding:14px 16px;flex:1;min-width:0}
  .msg.staff .bubble{background:linear-gradient(135deg,#2b1d13,#3d2a1c);border-color:#4a3423;color:#f8f1e8}
  .msg.staff .bubble .meta{color:rgba(246,237,228,.6)}
  .msg.staff .bubble .body{color:#f8f1e8}

  .msg .meta{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;font-size:12px;color:var(--c-ink-muted)}
  .msg .meta strong{font-size:13.5px;font-weight:700;color:var(--c-ink)}
  .msg.staff .meta strong{color:#f8f1e8}
  .msg .body{font-size:14.5px;line-height:1.6;color:var(--c-ink-soft);white-space:pre-wrap;word-wrap:break-word}

  .msg.divider{display:flex;align-items:center;gap:12px;margin:22px 0;justify-content:center}
  .msg.divider::before,.msg.divider::after{content:"";flex:1;height:1px;background:var(--c-border);max-width:120px}
  .msg.divider span{font-size:11px;font-weight:700;color:var(--c-ink-muted);text-transform:uppercase;letter-spacing:.1em}

  .composer{padding:16px 22px;background:var(--c-surface);border-top:1px solid var(--c-border);flex-shrink:0}
  .composer-inner{display:flex;gap:12px;align-items:flex-end;max-width:820px;margin:0 auto}
  .composer textarea{flex:1;min-height:52px;max-height:220px;padding:12px 14px;font-size:14.5px;color:var(--c-ink);background:var(--c-bg);border:1.5px solid var(--c-border);border-radius:var(--radius);outline:none;resize:none;font-family:inherit;line-height:1.5;transition:border-color var(--transition),box-shadow var(--transition)}
  .composer textarea:focus{border-color:var(--c-brand);box-shadow:0 0 0 4px rgba(185,146,106,.15);background:#fff}

  .send-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;font-size:14px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--c-brand),var(--c-brand-dark));border:0;border-radius:var(--radius);cursor:pointer;box-shadow:0 8px 18px rgba(185,146,106,.3);transition:transform var(--transition),box-shadow var(--transition),opacity var(--transition);flex-shrink:0}
  .send-btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 12px 22px rgba(185,146,106,.4)}
  .send-btn:disabled{opacity:.6;cursor:not-allowed}
  .send-btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

  .hint-bar{padding:8px 22px;text-align:center;font-size:12px;color:var(--c-ink-muted);background:var(--c-bg);border-top:1px solid var(--c-border);flex-shrink:0}
  .hint-bar strong{color:var(--c-ink-soft)}

  /* empty states */
  .empty-thread{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center;color:var(--c-ink-muted)}
  .empty-thread svg{width:56px;height:56px;margin:0 auto 16px;stroke:var(--c-brand);stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .empty-thread h3{font-size:22px;color:var(--c-ink);margin:0 0 6px}
  .empty-thread p{margin:0;font-size:13.5px}

  .empty-list{padding:50px 20px;text-align:center;color:var(--c-ink-muted);font-size:13.5px}

  .alert{display:block;padding:10px 14px;border-radius:var(--radius);font-size:13px;font-weight:500;line-height:1.45;background:var(--c-error-bg);color:var(--c-error);border:1px solid #f3c3bd;margin:0 22px 8px}
  .alert[hidden]{display:none}
  .alert[data-type="success"]{background:var(--c-success-bg);color:var(--c-success);border-color:#b7e2c2}

  /* mobile */
  .overlay{display:none;position:fixed;inset:0;background:rgba(43,29,19,.5);z-index:15;opacity:0;transition:opacity var(--transition)}
  .back-btn{display:none}

  @media (max-width:1100px){:root{--list-w:300px}}
  @media (max-width:900px){
    .app{grid-template-columns:1fr}
    .sidebar{position:fixed;left:0;top:0;width:var(--sidebar-w);height:100vh;transform:translateX(-100%);transition:transform 240ms cubic-bezier(.4,0,.2,1)}
    .sidebar.open{transform:translateX(0)}
    .overlay.show{display:block;opacity:1}
    .menu-toggle{display:grid;place-items:center}
    .topbar{padding:12px 16px}
    .inbox{grid-template-columns:1fr}
    .list-col{display:flex}
    .thread-col{display:none;position:fixed;inset:0;z-index:30;background:var(--c-bg)}
    .thread-col.open{display:flex}
    .back-btn{display:grid;place-items:center;background:transparent;border:1px solid var(--c-border);border-radius:var(--radius-sm);padding:8px;cursor:pointer;color:var(--c-ink);margin-right:6px}
    .thread-scroll{padding:18px 16px}
    .composer{padding:12px 14px}
  }
</style>
</head>
<body>

  <div class="overlay" id="overlay"></div>

  <div class="app">
    <!-- ═════════ SIDEBAR ═════════ -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark">L</span>
        <span class="brand-name">Lumière</span>
      </div>

      <nav class="nav">
        <div class="nav-label">Workspace</div>
        <a class="nav-item" href="bookings.html">
          <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/></svg>
          <span>Bookings</span>
        </a>
        <a class="nav-item active" href="messages.html">
          <svg class="ico" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.2L4 21l1.8-5.4A8 8 0 1 1 21 12z"/></svg>
          <span>Messages</span>
          <span class="badge" id="nav-badge" hidden>0</span>
        </a>
        <a class="nav-item" href="reviews.html">
          <svg class="ico" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.85-4.25 4.14 1 5.86L12 16.9l-5.25 2.75 1-5.86L3.5 9.65l5.9-.85L12 3.5z"/></svg>
          <span>Reviews</span>
        </a>

        <div class="nav-label">Manage</div>
        <a class="nav-item" href="services.html">
          <svg class="ico" viewBox="0 0 24 24"><path d="M20.6 8.6a2 2 0 0 0-1.4-.6H4.8a2 2 0 0 0-1.4.6l-1.4 1.4a2 2 0 0 0 0 2.8l7 7a2 2 0 0 0 2.8 0l7-7a2 2 0 0 0 0-2.8z"/><path d="M12 3v9"/></svg>
          <span>Services</span>
        </a>
        <a class="nav-item" href="team.html">
          <svg class="ico" viewBox="0 0 24 24"><path d="M16 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20"/><circle cx="9.5" cy="7.5" r="3.5"/><path d="M21 20v-1.5a4 4 0 0 0-3-3.87M16.5 4.13a4 4 0 0 1 0 6.74"/></svg>
          <span>Team</span>
        </a>
        <a class="nav-item" href="finances.html">
          <svg class="ico" viewBox="0 0 24 24"><path d="M3 20h18"/><path d="M6 20V10M11 20V4M16 20v-7M21 20v-11"/></svg>
          <span>Finances</span>
        </a>

        <div class="nav-label">Account</div>
        <a class="nav-item" href="my_profile.html">
          <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          <span>My profile</span>
        </a>
        <a class="nav-item" href="about_us.html">
          <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
          <span>About us</span>
        </a>
      </nav>

      <div class="user-card" id="user-card" title="My profile">
        <img class="user-avatar" id="user-avatar" alt="Your avatar" />
        <div class="user-meta">
          <div class="user-name" id="user-name">Loading…</div>
          <div class="user-role" id="user-role">—</div>
        </div>
        <button class="user-signout" id="signout-btn" title="Sign out" aria-label="Sign out">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
               stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <path d="M16 17l5-5-5-5M21 12H9"/>
          </svg>
        </button>
      </div>
    </aside>

    <!-- ═════════ MAIN ═════════ -->
    <main class="main">
      <header class="topbar">
        <button class="menu-toggle" id="menu-toggle" aria-label="Open menu">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
               stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18M3 12h18M3 18h18"/>
          </svg>
        </button>

        <div>
          <h1 class="page-title">Messages</h1>
          <p class="page-sub" id="page-sub">Client conversations</p>
        </div>

        <div class="topbar-right">
          <button class="icon-btn" id="refresh-btn" title="Refresh">
            <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
          </button>
        </div>
      </header>

      <div class="inbox">
        <!-- ───────── LIST COLUMN ───────── -->
        <div class="list-col" id="list-col">
          <div class="list-tools">
            <div class="search-wrap">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input id="search" type="search" placeholder="Search by name, code, subject…" />
            </div>
            <div class="status-chips" id="status-chips">
              <button class="chip active" data-filter="all">All <span class="n" id="c-all">0</span></button>
              <button class="chip" data-filter="open">Open <span class="n" id="c-open">0</span></button>
              <button class="chip" data-filter="pending">Pending <span class="n" id="c-pending">0</span></button>
              <button class="chip" data-filter="resolved">Resolved <span class="n" id="c-resolved">0</span></button>
              <button class="chip" data-filter="closed">Closed <span class="n" id="c-closed">0</span></button>
            </div>
          </div>
          <div class="list-scroll" id="list-scroll"></div>
        </div>

        <!-- ───────── THREAD COLUMN ───────── -->
        <div class="thread-col" id="thread-col">
          <div class="empty-thread" id="empty-thread">
            <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.2L4 21l1.8-5.4A8 8 0 1 1 21 12z"/></svg>
            <h3>Select a conversation</h3>
            <p>Pick a ticket on the left to read and reply.</p>
          </div>

          <div id="thread-view" hidden style="display:flex;flex-direction:column;height:100%;min-height:0">
            <div class="thread-head">
              <button class="back-btn" id="back-btn" aria-label="Back">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
              </button>
              <div class="who">
                <h2 id="t-subject">—</h2>
                <div class="sub" id="t-sub">—</div>
              </div>
              <div class="actions">
                <select class="status-select" id="status-select">
                  <option value="open">Open</option>
                  <option value="pending">Pending</option>
                  <option value="resolved">Resolved</option>
                  <option value="closed">Closed</option>
                </select>
                <button class="btn-sm danger" id="delete-btn" hidden>
                  <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
                  Delete
                </button>
              </div>
            </div>

            <div class="alert" id="thread-alert" hidden style="margin:14px 22px 0"></div>

            <div class="thread-scroll" id="thread-scroll"></div>

            <div class="composer" id="composer">
              <div class="composer-inner">
                <textarea id="reply-input" placeholder="Type your reply…  (Ctrl/⌘ + Enter to send)"></textarea>
                <button class="send-btn" id="send-btn">
                  <span class="btn-label">Send</span>
                  <svg viewBox="0 0 24 24" class="send-icon"><path d="m22 2-7 20-4-9-9-4 20-7z"/></svg>
                </button>
              </div>
            </div>
            <div class="hint-bar" id="hint-bar"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    /* ═════════════════════════════════════════════
       Supabase — inline
       ═════════════════════════════════════════════ */
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL      = 'https://ykkvxstsufkkkhaqgdwo.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlra3Z4c3RzdWZra2toYXFnZHdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNTIyMTUsImV4cCI6MjEwNDYyODIxNX0.CNgbBO4Gcp119rSzZ1jzkudiVMEVaz_xKJdiYYDKyH4';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });

    const LOG = {
      info:(...a)=>console.log('%c[MSG]','color:#2a5d95;font-weight:700',...a),
      ok  :(...a)=>console.log('%c[MSG ✓]','color:#1e7a3c;font-weight:700',...a),
      warn:(...a)=>console.warn('%c[MSG !]','color:#b8860b;font-weight:700',...a),
      err :(...a)=>console.error('%c[MSG ✗]','color:#c0392b;font-weight:700',...a),
      step:(n,...a)=>console.log(`%c[MSG → ${n}]`,'color:#8f6d4a;font-weight:700',...a),
    };
    LOG.info('messages.html loaded');

    const DEFAULT_AVATAR =
      "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'>" +
      "<defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>" +
      "<stop offset='0' stop-color='%23f6ede4'/><stop offset='1' stop-color='%23e6d4c2'/>" +
      "</linearGradient></defs>" +
      "<rect width='200' height='200' rx='100' fill='url(%23g)'/>" +
      "<circle cx='100' cy='80' r='34' fill='%23b9926a'/>" +
      "<path d='M40 175c8-38 40-58 60-58s52 20 60 58' fill='%23b9926a'/></svg>";

    /* ─── state ─── */
    const state = {
      user: null,
      profile: null,
      role: 'staff',
      isAdmin: false,
      tickets: [],
      active: null,          // selected ticket id
      activeReplies: [],
      filter: 'all',
      search: '',
      sending: false,
    };

    /* ─── DOM ─── */
    const $ = (id) => document.getElementById(id);
    const listScroll   = $('list-scroll');
    const threadView   = $('thread-view');
    const emptyThread  = $('empty-thread');
    const threadScroll = $('thread-scroll');
    const threadCol    = $('thread-col');
    const listCol      = $('list-col');
    const searchEl     = $('search');
    const chipsEl      = $('status-chips');
    const tSubject     = $('t-subject');
    const tSub         = $('t-sub');
    const statusSelect = $('status-select');
    const deleteBtn    = $('delete-btn');
    const replyInput   = $('reply-input');
    const sendBtn      = $('send-btn');
    const sendLabel    = sendBtn.querySelector('.btn-label');
    const threadAlert  = $('thread-alert');
    const hintBar      = $('hint-bar');
    const pageSub      = $('page-sub');
    const navBadge     = $('nav-badge');
    const refreshBtn   = $('refresh-btn');
    const menuToggle   = $('menu-toggle');
    const sidebar      = $('sidebar');
    const overlay      = $('overlay');
    const userCard     = $('user-card');
    const userNameEl   = $('user-name');
    const userRoleEl   = $('user-role');
    const userAvatarEl = $('user-avatar');
    const signoutBtn   = $('signout-btn');
    const backBtn      = $('back-btn');

    /* ─── helpers ─── */
    const esc = (s) => (s ?? '').toString()
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

    function relTime(iso) {
      if (!iso) return '';
      const d = new Date(iso), now = new Date();
      const s = Math.floor((now - d) / 1000);
      if (s < 60)          return 'just now';
      if (s < 3600)        return Math.floor(s/60) + 'm';
      if (s < 86400)       return Math.floor(s/3600) + 'h';
      if (s < 86400 * 7)   return Math.floor(s/86400) + 'd';
      return d.toLocaleDateString(undefined, { day:'numeric', month:'short' });
    }
    function fmtDateTime(iso) {
      if (!iso) return '';
      try {
        return new Date(iso).toLocaleString(undefined, {
          day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'
        });
      } catch { return ''; }
    }
    const initials = (n) => (n||'?').trim().split(/\s+/).slice(0,2)
      .map(w => w.charAt(0).toUpperCase()).join('');

    function showThreadAlert(msg, type='error') {
      threadAlert.textContent = msg;
      threadAlert.dataset.type = type;
      threadAlert.hidden = false;
      setTimeout(() => { threadAlert.hidden = true; }, 5000);
    }

    /* ─── mobile sidebar ─── */
    menuToggle.addEventListener('click', () => {
      sidebar.classList.add('open');
      overlay.classList.add('show');
    });
    overlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    });

    /* ─── sign out / user card ─── */
    async function doSignout() {
      await supabase.auth.signOut();
      location.replace('login.html');
    }
    signoutBtn.addEventListener('click', (e) => { e.stopPropagation(); doSignout(); });
    userCard.addEventListener('click', (e) => {
      if (e.target.closest('#signout-btn')) return;
      location.href = 'my_profile.html';
    });

    /* ═════════════════════════════════════════════
       DATA
       ═════════════════════════════════════════════ */
    async function loadTickets() {
      LOG.step('LOAD', 'Fetching tickets…');
      const { data, error } = await supabase
        .from('messages')
        .select('id, ticket_code, name, email, phone, subject, body, status, created_at, last_activity_at, is_read')
        .order('last_activity_at', { ascending: false });

      if (error) {
        LOG.err('LOAD', 'SELECT failed:', error);
        listScroll.innerHTML = '<div class="empty-list">Could not load tickets.</div>';
        return;
      }

      state.tickets = data || [];
      LOG.ok('LOAD', 'Got', state.tickets.length, 'ticket(s).');

      // unread badge
      const unread = state.tickets.filter(t => t.status === 'open' && !t.is_read).length;
      if (unread > 0) {
        navBadge.hidden = false;
        navBadge.textContent = unread;
      } else {
        navBadge.hidden = true;
      }

      pageSub.textContent = `${state.tickets.length} conversation${state.tickets.length === 1 ? '' : 's'}`;
      updateChipCounts();
      renderList();
    }

    async function loadReplies(ticketId) {
      LOG.step('LOAD', 'Fetching replies for ticket', ticketId);
      const { data, error } = await supabase
        .from('message_replies')
        .select('id, author_type, author_name, body, created_at')
        .eq('message_id', ticketId)
        .order('created_at', { ascending: true });

      if (error) {
        LOG.err('LOAD', 'Replies SELECT failed:', error);
        return [];
      }
      return data || [];
    }

    /* ═════════════════════════════════════════════
       CHIP COUNTS
       ═════════════════════════════════════════════ */
    function updateChipCounts() {
      const c = (s) => state.tickets.filter(t => s === 'all' || t.status === s).length;
      $('c-all').textContent      = c('all');
      $('c-open').textContent     = c('open');
      $('c-pending').textContent  = c('pending');
      $('c-resolved').textContent = c('resolved');
      $('c-closed').textContent   = c('closed');
    }

    /* ═════════════════════════════════════════════
       LIST RENDER
       ═════════════════════════════════════════════ */
    function filteredTickets() {
      let out = state.tickets;
      if (state.filter !== 'all') out = out.filter(t => t.status === state.filter);
      if (state.search) {
        const q = state.search;
        out = out.filter(t => {
          const hay = `${t.name} ${t.email} ${t.subject || ''} ${t.body} ${t.ticket_code || ''}`.toLowerCase();
          return hay.includes(q);
        });
      }
      return out;
    }

    function renderList() {
      const list = filteredTickets();
      listScroll.innerHTML = '';

      if (!list.length) {
        listScroll.innerHTML = '<div class="empty-list">No conversations match.</div>';
        return;
      }

      list.forEach(t => {
        const el = document.createElement('div');
        el.className = 'ticket';
        if (t.id === state.active) el.classList.add('selected');
        if (t.status === 'open' && !t.is_read) el.classList.add('unread');

        const snippet = (t.body || '').replace(/\s+/g, ' ').trim().slice(0, 80);
        const statusLabel = t.status.charAt(0).toUpperCase() + t.status.slice(1);

        el.innerHTML = `
          <div class="ticket-top">
            <span class="ticket-name">${esc(t.name || 'Anonymous')}</span>
            <span class="ticket-time">${esc(relTime(t.last_activity_at || t.created_at))}</span>
          </div>
          <p class="ticket-subj">${esc(t.subject || '(no subject)')}</p>
          <p class="ticket-snippet">${esc(snippet)}${snippet.length >= 80 ? '…' : ''}</p>
          <div class="ticket-foot">
            <span class="pill ${t.status}">${statusLabel}</span>
            <span class="pill code">${esc(t.ticket_code || '—')}</span>
          </div>`;

        el.addEventListener('click', () => openTicket(t.id));
        listScroll.appendChild(el);
      });

      LOG.ok('LIST', 'Rendered', list.length, 'ticket(s).');
    }

    /* ═════════════════════════════════════════════
       OPEN / RENDER THREAD
       ═════════════════════════════════════════════ */
    async function openTicket(ticketId) {
      const t = state.tickets.find(x => x.id === ticketId);
      if (!t) return;

      state.active = ticketId;
      renderList();
      emptyThread.hidden = true;
      threadView.hidden = false;
      threadCol.classList.add('open');

      // header
      tSubject.textContent = t.subject || '(no subject)';
      tSub.innerHTML = `
        ${esc(t.name || 'Anonymous')} &lt;${esc(t.email)}&gt;
        ${t.phone ? ' · ' + esc(t.phone) : ''}
        · <span style="font-family:ui-monospace,Menlo,Consolas,monospace">${esc(t.ticket_code || '—')}</span>`;
      statusSelect.value = t.status || 'open';
      deleteBtn.hidden = !state.isAdmin;

      // mark as read
      if (t.status === 'open' && !t.is_read) {
        await supabase.from('messages').update({ is_read: true }).eq('id', ticketId);
        t.is_read = true;
        // re-count badge
        const unread = state.tickets.filter(x => x.status === 'open' && !x.is_read).length;
        if (unread > 0) { navBadge.hidden = false; navBadge.textContent = unread; }
        else            { navBadge.hidden = true; }
        renderList();
      }

      // replies
      threadScroll.innerHTML = '<div style="text-align:center;padding:20px;color:var(--c-ink-muted);font-size:13px">Loading…</div>';
      state.activeReplies = await loadReplies(ticketId);
      renderThread();
      setTimeout(() => threadScroll.scrollTop = threadScroll.scrollHeight, 30);

      // Hint bar
      if (t.status === 'closed') {
        replyInput.disabled = true;
        sendBtn.disabled = true;
        hintBar.innerHTML = '<strong>This ticket is closed.</strong> Reopen it via the status dropdown to reply.';
      } else {
        replyInput.disabled = false;
        sendBtn.disabled = state.sending;
        hintBar.innerHTML = 'Replies are emailed to <strong>' + esc(t.email) + '</strong>';
      }
    }

    function renderThread() {
      const t = state.tickets.find(x => x.id === state.active);
      if (!t) return;

      threadScroll.innerHTML = '';

      // original message
      threadScroll.appendChild(buildMsg({
        type: 'client',
        name: t.name || 'Client',
        date: t.created_at,
        body: t.body || ''
      }));

      // divider
      const div = document.createElement('div');
      div.className = 'msg divider';
      div.innerHTML = '<span>Conversation</span>';
      threadScroll.appendChild(div);

      // replies
      if (!state.activeReplies.length) {
        const empty = document.createElement('div');
        empty.style.cssText = 'text-align:center;color:var(--c-ink-muted);font-size:13px;padding:16px';
        empty.textContent = 'No replies yet.';
        threadScroll.appendChild(empty);
      } else {
        state.activeReplies.forEach(r => {
          if (r.author_type === 'system') return;
          threadScroll.appendChild(buildMsg({
            type: r.author_type,
            name: r.author_name,
            date: r.created_at,
            body: r.body
          }));
        });
      }
    }

    function buildMsg({ type, name, date, body }) {
      const el = document.createElement('div');
      el.className = 'msg ' + (type === 'staff' ? 'staff' : 'client');
      el.innerHTML = `
        <div class="avatar">${esc(initials(name))}</div>
        <div class="bubble">
          <div class="meta">
            <strong>${esc(name || '—')}</strong>
            <span>${esc(fmtDateTime(date))}</span>
          </div>
          <div class="body">${esc(body)}</div>
        </div>`;
      return el;
    }

    /* ═════════════════════════════════════════════
       SEND REPLY
       ═════════════════════════════════════════════ */
    async function sendReply() {
      const t = state.tickets.find(x => x.id === state.active);
      if (!t || state.sending) return;

      const body = replyInput.value.trim();
      if (!body) return;

      state.sending = true;
      sendBtn.disabled = true;
      sendLabel.textContent = 'Sending…';

      const authorName =
        state.profile?.full_name?.trim() ||
        state.user.email?.split('@')[0] ||
        'Staff';

      LOG.step('REPLY', 'Inserting reply for', t.id);

      const { error } = await supabase
        .from('message_replies')
        .insert({
          message_id: t.id,
          author_type: 'staff',
          author_id: state.user.id,
          author_name: authorName,
          body
        });

      if (error) {
        LOG.err('REPLY', 'INSERT failed:', error);
        showThreadAlert(error.message || 'Could not send reply.');
        state.sending = false;
        sendBtn.disabled = false;
        sendLabel.textContent = 'Send';
        return;
      }

      LOG.ok('REPLY', 'Sent.');

      // The DB trigger already updated status to 'pending' and last_activity_at.
      // Update local state and refresh thread.
      const { data: updated } = await supabase
        .from('messages').select('status, last_activity_at').eq('id', t.id).maybeSingle();
      if (updated) {
        t.status = updated.status;
        t.last_activity_at = updated.last_activity_at;
      }
      statusSelect.value = t.status;

      state.activeReplies = await loadReplies(t.id);
      renderThread();
      replyInput.value = '';
      sendLabel.textContent = 'Send';
      state.sending = false;
      sendBtn.disabled = false;

      // update list ordering
      state.tickets.sort((a, b) =>
        new Date(b.last_activity_at) - new Date(a.last_activity_at)
      );
      renderList();

      setTimeout(() => threadScroll.scrollTop = threadScroll.scrollHeight, 30);
      showThreadAlert('Reply sent.', 'success');
    }

    sendBtn.addEventListener('click', sendReply);
    replyInput.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
        e.preventDefault();
        sendReply();
      }
    });

    /* ═════════════════════════════════════════════
       STATUS CHANGE
       ═════════════════════════════════════════════ */
    statusSelect.addEventListener('change', async () => {
      const t = state.tickets.find(x => x.id === state.active);
      if (!t) return;

      const next = statusSelect.value;
      if (next === t.status) return;

      LOG.step('STATUS', 'Changing', t.status, '→', next);

      const { error } = await supabase
        .from('messages').update({ status: next }).eq('id', t.id);

      if (error) {
        LOG.err('STATUS', 'Update failed:', error);
        showThreadAlert(error.message || 'Could not change status.');
        statusSelect.value = t.status;
        return;
      }

      t.status = next;
      updateChipCounts();
      renderList();
      showThreadAlert(`Status → ${next}.`, 'success');

      // if closed, disable composer
      if (next === 'closed') {
        replyInput.disabled = true;
        sendBtn.disabled = true;
        hintBar.innerHTML = '<strong>This ticket is closed.</strong> Reopen it to reply.';
      } else {
        replyInput.disabled = false;
        sendBtn.disabled = false;
        hintBar.innerHTML = 'Replies are emailed to <strong>' + esc(t.email) + '</strong>';
      }
    });

    /* ═════════════════════════════════════════════
       DELETE (admin only)
       ═════════════════════════════════════════════ */
    deleteBtn.addEventListener('click', async () => {
      const t = state.tickets.find(x => x.id === state.active);
      if (!t || !state.isAdmin) return;

      const ok = confirm(
        `Delete ticket ${t.ticket_code} from ${t.name}?\n\n` +
        `This removes the ticket and all replies. Cannot be undone.`
      );
      if (!ok) return;

      LOG.step('DELETE', 'Deleting ticket', t.id);
      const { error } = await supabase.from('messages').delete().eq('id', t.id);

      if (error) {
        LOG.err('DELETE', 'Failed:', error);
        showThreadAlert(error.message || 'Could not delete.');
        return;
      }

      state.tickets = state.tickets.filter(x => x.id !== t.id);
      state.active = null;
      threadView.hidden = true;
      emptyThread.hidden = false;
      threadCol.classList.remove('open');
      updateChipCounts();
      renderList();
      LOG.ok('DELETE', 'Deleted.');
    });

    /* ═════════════════════════════════════════════
       FILTERS + SEARCH
       ═════════════════════════════════════════════ */
    chipsEl.addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      state.filter = chip.dataset.filter;
      chipsEl.querySelectorAll('.chip').forEach(c =>
        c.classList.toggle('active', c === chip)
      );
      renderList();
    });
    searchEl.addEventListener('input', () => {
      state.search = searchEl.value.trim().toLowerCase();
      renderList();
    });

    backBtn.addEventListener('click', () => {
      threadCol.classList.remove('open');
      state.active = null;
      renderList();
    });

    refreshBtn.addEventListener('click', async () => {
      await loadTickets();
      if (state.active) await openTicket(state.active);
    });

    /* ═════════════════════════════════════════════
       REALTIME — refresh list when new ticket or reply arrives
       ═════════════════════════════════════════════ */
    function subscribeRealtime() {
      LOG.step('RT', 'Subscribing to realtime…');

      supabase
        .channel('public:messages')
        .on('postgres_changes',
          { event: '*', schema: 'public', table: 'messages' },
          (payload) => {
            LOG.info('RT', 'messages change:', payload.eventType);
            loadTickets();
          })
        .subscribe();

      supabase
        .channel('public:message_replies')
        .on('postgres_changes',
          { event: 'INSERT', schema: 'public', table: 'message_replies' },
          (payload) => {
            const row = payload.new;
            LOG.info('RT', 'new reply for ticket', row.message_id);
            if (row.message_id === state.active) {
              loadReplies(state.active).then(rs => {
                state.activeReplies = rs;
                renderThread();
                setTimeout(() => threadScroll.scrollTop = threadScroll.scrollHeight, 30);
              });
            }
            loadTickets();
          })
        .subscribe();
    }

    /* ═════════════════════════════════════════════
       BOOT
       ═════════════════════════════════════════════ */
    async function boot() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session?.user) { location.replace('login.html'); return; }

      state.user = session.user;

      const { data: profile } = await supabase
        .from('profiles')
        .select('full_name, role, avatar_url')
        .eq('id', session.user.id)
        .maybeSingle();

      state.profile = profile;
      state.role    = (profile?.role || 'staff').toLowerCase();
      state.isAdmin = state.role === 'admin' || state.role === 'developer';

      if (!['staff','admin','developer'].includes(state.role)) {
        location.replace('dashboard.html'); return;
      }

      const displayName =
        profile?.full_name?.trim() ||
        session.user.email?.split('@')[0] || 'You';
      userNameEl.textContent = displayName;
      userRoleEl.textContent = state.role;
      userAvatarEl.src = profile?.avatar_url || DEFAULT_AVATAR;
      userAvatarEl.onerror = () => { userAvatarEl.src = DEFAULT_AVATAR; };

      await loadTickets();
      subscribeRealtime();
    }

    supabase.auth.onAuthStateChange((event, session) => {
      LOG.info('AUTH-EVENT', event, '| user:', session?.user?.email ?? 'none');
    });

    boot();
    LOG.info('messages.html ready.');
  </script>
</body>
</html>
